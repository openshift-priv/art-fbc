- type: olm.csv.metadata
  value:
    annotations:
      alm-examples: "[\n  {\n    \"apiVersion\": \"autoscaling.openshift.io/v1\",\n    \"kind\": \"VerticalPodAutoscalerController\",\n    \"metadata\": {\n      \"name\": \"default\",\n      \"namespace\": \"openshift-vertical-pod-autoscaler\"\n    },\n    \"spec\": {\n      \"podMinCPUMillicores\": 25,\n      \"podMinMemoryMb\": 250,\n      \"recommendationOnly\": false,\n      \"safetyMarginFraction\": 0.15,\n      \"minReplicas\": 2\n    }\n  },\n  {\n     \"apiVersion\": \"autoscaling.k8s.io/v1\",\n     \"kind\": \"VerticalPodAutoscaler\",\n     \"metadata\": {\n        \"name\": \"myapp-vpa\"\n     },\n     \"spec\": {\n        \"targetRef\": {\n           \"apiVersion\": \"apps/v1\",\n           \"kind\": \"Deployment\",\n           \"name\": \"myapp-deployment\"\n        },\n        \"resourcePolicy\": {\n           \"containerPolicies\": [\n              {\n                 \"containerName\": \"*\",\n                 \"minAllowed\": {\n                    \"cpu\": \"100m\",\n                    \"memory\": \"50Mi\"\n                 },\n                 \"maxAllowed\": {\n                    \"cpu\": 1,\n                    \"memory\": \"500Mi\"\n                 },\n                 \"controlledResources\": [\n                    \"cpu\",\n                    \"memory\"\n                 ]\n              }\n           ]\n        }\n     }\n  }\n]\n"
      capabilities: Full Lifecycle
      categories: OpenShift Optional
      certifiedLevel: Primed
      containerImage: registry.redhat.io/openshift4/ose-vertical-pod-autoscaler-rhel9-operator@sha256:4c73f66da1a003af94149a987c35a70c63472111dc77f0b052b7c9e01de1bb56
      createdAt: '2019-10-14T12:17:13+00:00'
      description: An operator to run the OpenShift Vertical Pod Autoscaler. Vertical Pod Autoscaler (VPA) can be configured to monitor a workload's resource utilization, and then adjust its CPU and memory limits by updating the pod (future) or restarting the pod with updated limits.
      features.operators.openshift.io/disconnected: 'true'
      features.operators.openshift.io/fips-compliant: 'true'
      features.operators.openshift.io/proxy-aware: 'false'
      features.operators.openshift.io/tls-profiles: 'false'
      features.operators.openshift.io/token-auth-aws: 'false'
      features.operators.openshift.io/token-auth-azure: 'false'
      features.operators.openshift.io/token-auth-gcp: 'false'
      healthIndex: B
