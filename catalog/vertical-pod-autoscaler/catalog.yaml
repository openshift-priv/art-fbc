  value:
    annotations:
      alm-examples: |-
        [
          {
            "apiVersion": "autoscaling.k8s.io/v1",
            "kind": "VerticalPodAutoscaler",
            "metadata": {
              "name": "myapp-vpa"
            },
            "spec": {
              "resourcePolicy": {
                "containerPolicies": [
                  {
                    "containerName": "*",
                    "controlledResources": [
                      "cpu",
                      "memory"
                    ],
                    "maxAllowed": {
                      "cpu": 1,
                      "memory": "500Mi"
                    },
                    "minAllowed": {
                      "cpu": "100m",
                      "memory": "50Mi"
                    }
                  }
                ]
              },
              "targetRef": {
                "apiVersion": "apps/v1",
                "kind": "Deployment",
                "name": "myapp-deployment"
              }
            }
          },
          {
            "apiVersion": "autoscaling.openshift.io/v1",
            "kind": "VerticalPodAutoscalerController",
            "metadata": {
              "name": "default"
            },
            "spec": {
              "minReplicas": 2,
              "podMinCPUMillicores": 25,
              "podMinMemoryMb": 250,
              "safetyMarginFraction": 0.15
            }
          }
        ]
      capabilities: Full Lifecycle
