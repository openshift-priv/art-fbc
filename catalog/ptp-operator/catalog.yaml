        - description: 'TransportHost format is <protocol>://<transport-service>.<namespace>.svc.cluster.local:<transport-port> Example HTTP transport: "http://ptp-event-publisher-service-NODE_NAME.openshift-ptp.svc.cluster.local:9043"'
          displayName: Transport Host
          path: ptpEventConfig.transportHost
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:text
        version: v1
    description: "# Precision Time Protocol (PTP) Operator for Openshift\n\n## Introdution\nPTP Operator manages cluster wide PTP configuration.\nThis operator has to run in namespace 'openshift-ptp'. An Operator Group is also required to install this operator:\n```\n$ oc create -f - <<EOF\napiVersion: v1\nkind: Namespace\nmetadata:\n  name: openshift-ptp\n  labels:\n    name: openshift-ptp\n    openshift.io/cluster-monitoring: \"true\"\nEOF\n\n$ oc create -f - <<EOF\napiVersion: operators.coreos.com/v1\nkind: OperatorGroup\nmetadata:\n  name: ptp-operators\n  namespace: openshift-ptp\nspec:\n  targetNamespaces:\n  - openshift-ptp\nEOF\n```\n"
    displayName: PTP Operator
    installModes:
    - supported: true
      type: OwnNamespace
    - supported: true
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: false
      type: AllNamespaces
    keywords:
    - ptp
    links:
    - name: Documentation operator
      url: https://github.com/k8snetworkplumbingwg/ptp-operator
    - name: Documentation operand
      url: https://github.com/k8snetworkplumbingwg/linuxptp-daemon
    maintainers:
    - email: support@redhat.com
      name: Red Hat
    maturity: alpha
    provider:
      name: Red Hat
