          displayName: Transport Host
          path: ptpEventConfig.transportHost
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:text
        version: v1
    description: |
      # Precision Time Protocol (PTP) Operator for Openshift

      ## Introdution
      PTP Operator manages cluster wide PTP configuration.
      This operator has to run in namespace 'openshift-ptp'. An Operator Group is also required to install this operator:
      ```
      $ oc create -f - <<EOF
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-ptp
        labels:
          name: openshift-ptp
          openshift.io/cluster-monitoring: "true"
      EOF

      $ oc create -f - <<EOF
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: ptp-operators
        namespace: openshift-ptp
      spec:
        targetNamespaces:
        - openshift-ptp
      EOF
      ```
    displayName: PTP Operator
    installModes:
    - supported: true
      type: OwnNamespace
    - supported: true
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: false
      type: AllNamespaces
    keywords:
    - ptp
    links:
    - name: Documentation operator
      url: https://github.com/openshift/ptp-operator
    - name: Documentation operand
      url: https://github.com/openshift/linuxptp-daemon
    maintainers:
    - email: support@redhat.com
      name: Red Hat
    maturity: alpha
    provider:
      name: Red Hat
