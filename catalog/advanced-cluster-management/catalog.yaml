    apiServiceDefinitions: {}
    crdDescriptions:
      owned:
      - description: "MulticlusterHub defines the configuration\nfor an instance of a multicluster hub, a central point for managing multiple\nKubernetes-based clusters. The deployment of multicluster hub components\nis determined based on the configuration that is defined in this resource."
        displayName: MultiClusterHub
        kind: MultiClusterHub
        name: multiclusterhubs.operator.open-cluster-management.io
        specDescriptors:
        - description: 'Specifies deployment replication for improved availability. Options are: Basic and High (default)'
          displayName: Availability Configuration
          path: availabilityConfig
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:advanced
          - urn:alm:descriptor:com.tectonic.ui:select:High
          - urn:alm:descriptor:com.tectonic.ui:select:Basic
        - description: Disable automatic import of the hub cluster as a managed cluster
          displayName: Disable Hub Self Management
          path: disableHubSelfManagement
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:advanced
          - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        - description: Disable automatic update of ClusterImageSets
          displayName: Disable Update ClusterImageSets
          path: disableUpdateClusterImageSets
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:advanced
          - urn:alm:descriptor:com.tectonic.ui:booleanSwitch
        - description: Override pull secret for accessing MultiClusterHub operand and endpoint images
          displayName: Image Pull Secret
          path: imagePullSecret
          x-descriptors:
          - urn:alm:descriptor:io.kubernetes:Secret
          - urn:alm:descriptor:com.tectonic.ui:advanced
        - description: The name of the local-cluster resource
          displayName: Local Cluster Name
          path: localClusterName
          x-descriptors:
          - urn:alm:descriptor:io.kubernetes:text
          - urn:alm:descriptor:com.tectonic.ui:advanced
        - description: NetworkPolicies configures NetworkPolicy deployment for ACM components
          displayName: NetworkPolicies Configuration
          path: networkPolicies
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:advanced
        - description: Developer Overrides
          displayName: Developer Overrides
          path: overrides
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:hidden
        - description: 'Provides optional configuration for components, the list of which can be found here: https://github.com/stolostron/multiclusterhub-operator/tree/main/docs/available-components.md'
          displayName: Component Configuration
          path: overrides.components
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:hidden
