    apiServiceDefinitions: {}
    crdDescriptions:
      owned:
      - description: "MulticlusterHub defines the configuration\nfor an instance of a multicluster hub, a central point for managing multiple\nKubernetes-based clusters. The deployment of multicluster hub components\nis determined based on the configuration that is defined in this resource."
        displayName: MultiClusterHub
        kind: MultiClusterHub
        name: multiclusterhubs.operator.open-cluster-management.io
        specDescriptors:
        - description: 'Specifies deployment replication for improved availability. Options are: Basic and High (default)'
          displayName: Availability Configuration
