      operatorframework.io/arch.s390x: supported
      operatorframework.io/os.linux: supported
    links:
    - name: Documentation
      url: https://access.redhat.com/documentation/en-us/red_hat_advanced_cluster_management_for_kubernetes/2.16/
    maintainers:
    - email: acm-contact@redhat.com
      name: Red Hat
    maturity: stable
    provider:
      name: Red Hat
