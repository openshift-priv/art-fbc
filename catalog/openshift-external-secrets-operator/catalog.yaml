- type: olm.csv.metadata
  value:
    annotations:
      alm-examples: "[\n  {\n    \"apiVersion\": \"external-secrets.io/v1\",\n    \"kind\": \"ClusterExternalSecret\",\n    \"metadata\": {\n      \"annotations\": {\n        \"external-secrets.io/example\": \"true\"\n      },\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"secret-cluster\"\n    },\n    \"spec\": {\n      \"externalSecretSpec\": {\n        \"data\": [\n          {\n            \"remoteRef\": {\n              \"key\": \"gcp-secret\"\n            },\n            \"secretKey\": \"key\"\n          }\n        ],\n        \"refreshInterval\": \"1h\",\n        \"secretStoreRef\": {\n          \"kind\": \"ClusterSecretStore\",\n          \"name\": \"gcp-cluster-secretstore\"\n        },\n        \"target\": {\n          \"creationPolicy\": \"Owner\",\n          \"name\": \"gcp-secret-k8s\"\n        }\n      },\n      \"namespaceSelector\": {\n        \"matchLabels\": {\n          \"app.kubernetes.io/managed-by\": \"external-secrets-operator\"\n        }\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"external-secrets.io/v1\",\n    \"kind\": \"ClusterSecretStore\",\n    \"metadata\": {\n      \"annotations\": {\n        \"external-secrets.io/example\": \"true\"\n      },\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"gcp-cluster-secretstore\"\n    },\n    \"spec\": {\n      \"provider\": {\n        \"gcpsm\": {\n          \"auth\": {\n            \"secretRef\": {\n              \"secretAccessKeySecretRef\": {\n                \"key\": \"secret-access-key.json\",\n                \"name\": \"gcp-creds\",\n                \"namespace\": \"external-secrets\"\n              }\n            }\n          },\n          \"projectID\": \"openshift-sample-project\"\n        }\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"external-secrets.io/v1\",\n    \"kind\": \"ExternalSecret\",\n    \"metadata\": {\n      \"annotations\": {\n        \"external-secrets.io/example\": \"true\"\n      },\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"gcp-secret\",\n      \"namespace\": \"external-secrets\"\n    },\n    \"spec\": {\n      \"data\": [\n        {\n          \"remoteRef\": {\n            \"key\": \"gcp-secret\",\n            \"property\": \"Key\"\n          },\n          \"secretKey\": \"Key\"\n        }\n      ],\n      \"refreshInterval\": \"1h\",\n      \"secretStoreRef\": {\n        \"kind\": \"SecretStore\",\n        \"name\": \"secretstore\"\n      },\n      \"target\": {\n        \"creationPolicy\": \"Owner\",\n        \"name\": \"k8s-secret\"\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"external-secrets.io/v1\",\n    \"kind\": \"SecretStore\",\n    \"metadata\": {\n      \"annotations\": {\n        \"external-secrets.io/disable-maintenance-checks\": \"true\"\n      },\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"secretstore\",\n      \"namespace\": \"external-secrets\"\n    },\n    \"spec\": {\n      \"provider\": {\n        \"gcpsm\": {\n          \"auth\": {\n            \"secretRef\": {\n              \"secretAccessKeySecretRef\": {\n                \"key\": \"secret-access-key.json\",\n                \"name\": \"gcp-creds\"\n              }\n            }\n          },\n          \"projectID\": \"openshift-sample-project\"\n        }\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"external-secrets.io/v1alpha1\",\n    \"kind\": \"PushSecret\",\n    \"metadata\": {\n      \"annotations\": {\n        \"external-secrets.io/example\": \"true\"\n      },\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"pushsecret-sample\",\n      \"namespace\": \"external-secrets\"\n    },\n    \"spec\": {\n      \"config\": {\n        \"gcp\": {\n          \"projectID\": \"openshift-sample-project\",\n          \"secret\": {\n            \"name\": \"test\",\n            \"replicationPolicy\": \"automatic\",\n            \"version\": \"latest\"\n          }\n        }\n      },\n      \"secretStoreRefs\": [\n        {\n          \"kind\": \"ClusterSecretStore\",\n          \"name\": \"gcp-cluster-secretstore\"\n        }\n      ],\n      \"selector\": {\n        \"secret\": {\n          \"name\": \"gcp-secret-k8s\"\n        }\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"generators.external-secrets.io/v1alpha1\",\n    \"kind\": \"Password\",\n    \"metadata\": {\n      \"annotations\": {\n        \"external-secrets.io/example\": \"true\"\n      },\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"password-sample\",\n      \"namespace\": \"external-secrets\"\n    },\n    \"spec\": {\n      \"excludeLowercase\": false,\n      \"excludeNumbers\": false,\n      \"excludeUppercase\": false,\n      \"includeSymbols\": true,\n      \"length\": 20\n    }\n  },\n  {\n    \"apiVersion\": \"operator.openshift.io/v1alpha1\",\n    \"kind\": \"ExternalSecretsConfig\",\n    \"metadata\": {\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"cluster\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"operator.openshift.io/v1alpha1\",\n    \"kind\": \"ExternalSecretsManager\",\n    \"metadata\": {\n      \"labels\": {\n        \"app\": \"external-secrets-operator\"\n      },\n      \"name\": \"cluster\"\n    },\n    \"spec\": {}\n  }\n]"
