    apiServiceDefinitions: {}
    crdDescriptions:
      owned:
      - description: "ACRAccessToken returns an Azure Container Registry token that can be used for pushing/pulling images.\nNote: by default it will return an ACR Refresh Token with full access (depending on the identity).\nThis can be scoped down to the repository level using .spec.scope. In case scope is defined it will return an ACR Access Token.\n\nSee docs: https://github.com/Azure/acr/blob/main/docs/AAD-OAuth.md"
        displayName: ACRAccessToken
        kind: ACRAccessToken
        name: acraccesstokens.generators.external-secrets.io
        version: v1alpha1
      - description: ClusterExternalSecret is the Schema for the clusterexternalsecrets API.
        displayName: ClusterExternalSecret
        kind: ClusterExternalSecret
        name: clusterexternalsecrets.external-secrets.io
        version: v1
      - description: ClusterGenerator represents a cluster-wide generator which can be referenced as part of `generatorRef` fields.
        displayName: ClusterGenerator
        kind: ClusterGenerator
        name: clustergenerators.generators.external-secrets.io
        version: v1alpha1
      - description: ClusterPushSecret is the Schema for the clusterpushsecrets API.
        displayName: ClusterPushSecret
        kind: ClusterPushSecret
        name: clusterpushsecrets.external-secrets.io
        version: v1alpha1
      - description: ClusterSecretStore represents a secure external location for storing secrets, which can be referenced as part of `storeRef` fields.
        displayName: ClusterSecretStore
        kind: ClusterSecretStore
        name: clustersecretstores.external-secrets.io
        version: v1
      - description: "ECRAuthorizationToken uses the GetAuthorizationToken API to retrieve an authorization token. The authorization\ntoken is valid for 12 hours. The authorizationToken returned is a base64 encoded string that can be decoded and\nused in a Docker login command to authenticate to a registry. For more information, see Registry authentication\n(https://docs.aws.amazon.com/AmazonECR/latest/userguide/Registries.html#registry_auth)\nin the Amazon Elastic Container Registry User Guide."
        displayName: ECRAuthorizationToken
        kind: ECRAuthorizationToken
        name: ecrauthorizationtokens.generators.external-secrets.io
        version: v1alpha1
      - description: ExternalSecret is the Schema for the external-secrets API.
        displayName: ExternalSecret
        kind: ExternalSecret
        name: externalsecrets.external-secrets.io
        version: v1
      - description: "ExternalSecretsConfig describes configuration and information about the managed external-secrets deployment.\nThe name must be `cluster` as ExternalSecretsConfig is a singleton, allowing only one instance per cluster.\n\nWhen an ExternalSecretsConfig is created, the controller installs the external-secrets and keeps it in the desired state."
        displayName: ExternalSecretsConfig
        kind: ExternalSecretsConfig
        name: externalsecretsconfigs.operator.openshift.io
        version: v1alpha1
      - description: "ExternalSecretsManager describes configuration and information about the deployments managed by\nthe operator. The name must be `cluster` to make ExternalSecretsManager a singleton that is, to\nallow only one instance of ExternalSecretsManager per cluster.\n\nExternalSecretsManager is mainly for configuring the global options and enabling the features, which\nserves as a common/centralized config for managing multiple controllers of the operator. The object\nwill be created during the operator installation."
        displayName: ExternalSecretsManager
        kind: ExternalSecretsManager
        name: externalsecretsmanagers.operator.openshift.io
        version: v1alpha1
      - description: GCRAccessToken generates a GCP access token that can be used to authenticate with GCR.
        displayName: GCRAccessToken
        kind: GCRAccessToken
        name: gcraccesstokens.generators.external-secrets.io
        version: v1alpha1
      - description: GeneratorState is the Schema for the generatorstates API.
        displayName: GeneratorState
        kind: GeneratorState
        name: generatorstates.generators.external-secrets.io
        version: v1alpha1
      - description: GithubAccessToken generates a ghs_ access token
        displayName: GithubAccessToken
        kind: GithubAccessToken
        name: githubaccesstokens.generators.external-secrets.io
        version: v1alpha1
      - description: Grafana is the Schema for the grafanas API.
        displayName: Grafana
        kind: Grafana
        name: grafanas.generators.external-secrets.io
        version: v1alpha1
      - description: MFA generates a new TOTP token that is compliant with RFC 6238.
        displayName: MFA
        kind: MFA
        name: mfas.generators.external-secrets.io
        version: v1alpha1
      - description: "Password generates a random password based on the configuration parameters in spec. You can specify the length,\ncharacter set and other attributes."
        displayName: Password
        kind: Password
        name: passwords.generators.external-secrets.io
        version: v1alpha1
      - description: PushSecret is the Schema for the pushsecrets API.
        displayName: PushSecret
        kind: PushSecret
        name: pushsecrets.external-secrets.io
        version: v1alpha1
      - description: QuayAccessToken generates a Quay OAuth token for pulling/pushing images.
        displayName: QuayAccessToken
        kind: QuayAccessToken
        name: quayaccesstokens.generators.external-secrets.io
        version: v1alpha1
      - description: SecretStore represents a secure external location for storing secrets, which can be referenced as part of `storeRef` fields.
        displayName: SecretStore
        kind: SecretStore
        name: secretstores.external-secrets.io
        version: v1
      - description: SSHKey generates SSH key pairs.
        displayName: SSHKey
        kind: SSHKey
        name: sshkeys.generators.external-secrets.io
        version: v1alpha1
      - description: "STSSessionToken uses the GetSessionToken API to retrieve an authorization token. The authorization token is\nvalid for 12 hours. The authorizationToken returned is a base64 encoded string that can be decoded.\nFor more information, see GetSessionToken (https://docs.aws.amazon.com/STS/latest/APIReference/API_GetSessionToken.html)."
        displayName: STSSessionToken
        kind: STSSessionToken
        name: stssessiontokens.generators.external-secrets.io
        version: v1alpha1
      - description: UUID generates a version 1 UUID (for example, 6ba7b810-9dad-11d1-80b4-00c04fd430c8).
        displayName: UUID
        kind: UUID
        name: uuids.generators.external-secrets.io
        version: v1alpha1
      - description: VaultDynamicSecret is the Schema for the vaultdynamicsecrets API.
        displayName: VaultDynamicSecret
        kind: VaultDynamicSecret
        name: vaultdynamicsecrets.generators.external-secrets.io
        version: v1alpha1
      - description: "Webhook connects to a third party API server to handle the secrets generation configuration parameters in spec. You\ncan specify the server, the token, and additional body parameters. See documentation for the full API specification\nfor requests and responses."
        displayName: Webhook
        kind: Webhook
        name: webhooks.generators.external-secrets.io
        version: v1alpha1
    description: External Secrets Operator for Red Hat OpenShift deploys and manages `external-secrets` application in OpenShift clusters. `external-secrets` provides an uniform interface to fetch secrets stored in external providers like  AWS Secrets Manager, HashiCorp Vault, Google Secrets Manager, Azure Key Vault, IBM Cloud Secrets Manager to name a few, stores them as secrets in OpenShift. It provides APIs to define authentication and the details of the secret to fetch.
    displayName: External Secrets Operator for Red Hat OpenShift
    installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
    keywords:
    - security
    - secrets
    - external-secrets
    - external-secrets-operator
    labels:
      operatorframework.io/arch.amd64: supported
      operatorframework.io/arch.arm64: supported
      operatorframework.io/arch.ppc64le: supported
      operatorframework.io/arch.s390x: supported
      operatorframework.io/os.linux: supported
    links:
    - name: Documentation
      url: https://docs.redhat.com/en/documentation/openshift_container_platform/latest/html/security_and_compliance/external-secrets-operator-for-red-hat-openshift
    - name: External Secrets Operator
      url: https://github.com/openshift/external-secrets-operator/blob/master/README.md
    maintainers:
    - email: support@redhat.com
      name: Red Hat Support
    maturity: alpha
    minKubeVersion: 1.32.0
    provider:
      name: Red Hat, Inc.
