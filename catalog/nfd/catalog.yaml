      operators.operatorframework.io/internal-objects: '["noderesourcetopologies.topology.node.k8s.io"]'
      operators.operatorframework.io/project_layout: go.kubebuilder.io/v3
      provider: Red Hat
      repository: https://github.com/openshift/cluster-nfd-operator
      support: Red Hat
    apiServiceDefinitions: {}
    crdDescriptions:
      owned:
      - description: 'The NodeFeatureDiscovery instance is the CustomResource being watched by the NFD-Operator, and holds all the needed information to setup the behaviour of the master and worker pods

          '
        kind: NodeFeatureDiscovery
        name: nodefeaturediscoveries.nfd.openshift.io
