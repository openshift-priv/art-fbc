- type: olm.csv.metadata
  value:
    annotations:
      alm-examples: |-
        [
          {
            "apiVersion": "local.storage.openshift.io/v1",
            "kind": "LocalVolume",
            "metadata": {
              "name": "example"
            },
            "spec": {
              "nodeSelector": {
                "nodeSelectorTerms": [
                  {
                    "matchExpressions": [
                      {
                        "key": "kubernetes.io/hostname",
                        "operator": "In",
                        "values": [
                          "worker-0",
                          "worker-1"
                        ]
                      }
                    ]
                  }
                ]
              },
              "storageClassDevices": [
                {
                  "devicePaths": [
                    "/dev/disk/by-id/ata-crucial"
                  ],
                  "fsType": "ext4",
                  "storageClassName": "foobar",
                  "volumeMode": "Filesystem"
                }
              ]
            }
          },
          {
            "apiVersion": "local.storage.openshift.io/v1alpha1",
            "kind": "LocalVolumeSet",
            "metadata": {
              "name": "example-localvolumeset"
            },
            "spec": {
              "deviceInclusionSpec": {
                "deviceMechanicalProperties": [
                  "Rotational",
                  "NonRotational"
                ],
                "deviceTypes": [
                  "disk"
                ],
                "maxSize": "100G",
                "minSize": "10G"
              },
              "maxDeviceCount": 10,
              "nodeSelector": {
                "nodeSelectorTerms": [
                  {
                    "matchExpressions": [
                      {
                        "key": "kubernetes.io/hostname",
                        "operator": "In",
                        "values": [
                          "worker-0",
                          "worker-1"
                        ]
                      }
                    ]
                  }
                ]
              },
              "storageClassName": "example-storageclass",
              "volumeMode": "Block"
            }
          },
          {
            "apiVersion": "local.storage.openshift.io/v1alpha1",
            "kind": "LocalVolumeDiscovery",
            "metadata": {
              "name": "auto-discover-devices"
            },
            "spec": {
              "nodeSelector": {
                "nodeSelectorTerms": [
                  {
                    "matchExpressions": [
                      {
                        "key": "kubernetes.io/hostname",
                        "operator": "In",
                        "values": [
                          "worker-0",
                          "worker-1"
                        ]
                      }
                    ]
                  }
                ]
              }
            }
          }
        ]
      capabilities: Full Lifecycle
      categories: Storage
      containerImage: registry.redhat.io/openshift4/ose-local-storage-rhel9-operator@sha256:95bc0eb763404cc8f37764fe4114e9151864e2eceec6860d5d099fcf7d4f0e7d
      createdAt: "2019-08-14T00:00:00Z"
      description: Configure and use local storage volumes.
      features.operators.openshift.io/csi: "false"
