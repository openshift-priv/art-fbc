        displayName: Local Volume Discovery Result
        kind: LocalVolumeDiscoveryResult
        name: localvolumediscoveryresults.local.storage.openshift.io
        specDescriptors:
        - description: Node on which the devices are discovered
          displayName: NodeName
          path: nodeName
        statusDescriptors:
        - description: DiscoveredTimeStamp is the last timestamp when the list of discovered devices was updated
          displayName: DiscoveredTimeStamp
          path: discoveredTimeStamp
        - description: DiscoveredDevices contains the list of devices discovered on the node
          displayName: DiscoveredDevices
          path: discoveredDevices
        version: v1alpha1
      - description: LocalVolumeDeviceLink establishes a link between block devices on the node and PersistentVolumes created by Local Storage Operator
        displayName: Local Volume Device Link
        kind: LocalVolumeDeviceLink
        name: localvolumedevicelinks.local.storage.openshift.io
        specDescriptors:
        - description: PersistentVolumeName is the name of the persistent volume linked to the device
          displayName: PersistentVolumeName
          path: persistentVolumeName
        - description: Policy expresses how to manage symlinks for the device
          displayName: Policy
          path: policy
        statusDescriptors:
        - description: CurrentLinkTarget is the current by-id symlink used for the device
          displayName: CurrentLinkTarget
          path: currentLinkTarget
        - description: PreferredLinkTarget is the preferred by-id symlink for the device
          displayName: PreferredLinkTarget
          path: preferredLinkTarget
        - description: ValidLinkTargets is the list of valid by-id symlinks for the device
          displayName: ValidLinkTargets
          path: validLinkTargets
        - description: FilesystemUUID is the UUID of the filesystem found on the device (when available)
          displayName: FilesystemUUID
          path: filesystemUUID
        - description: Last known condition of this object
          displayName: Conditions
          path: conditions
          x-descriptors:
          - urn:alm:descriptor:io.kubernetes.conditions
        version: v1
