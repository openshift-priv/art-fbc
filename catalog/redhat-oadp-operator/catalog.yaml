        displayName: VolumeSnapshotLocation
        kind: VolumeSnapshotLocation
        name: volumesnapshotlocations.velero.io
        statusDescriptors:
        - description: Phase is the current lifecycle phase of the VolumeSnapshotLocation
          displayName: Phase
          path: phase
