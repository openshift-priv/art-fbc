- type: olm.csv.metadata
  value:
    annotations:
      alm-examples: "[\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"DataProtectionApplication\",\n    \"metadata\": {\n      \"name\": \"velero-sample\"\n    },\n    \"spec\": {\n      \"backupLocations\": [\n        {\n          \"velero\": {\n            \"config\": {\n              \"profile\": \"default\",\n              \"region\": \"us-east-1\"\n            },\n            \"credential\": {\n              \"key\": \"cloud\",\n              \"name\": \"cloud-credentials\"\n            },\n            \"default\": true,\n            \"objectStorage\": {\n              \"bucket\": \"my-bucket-name\",\n              \"prefix\": \"velero\"\n            },\n            \"provider\": \"aws\"\n          }\n        }\n      ],\n      \"configuration\": {\n        \"nodeAgent\": {\n          \"enable\": true,\n          \"uploaderType\": \"kopia\"\n        },\n        \"velero\": {\n          \"defaultPlugins\": [\n            \"openshift\",\n            \"aws\",\n            \"kubevirt\",\n            \"hypershift\"\n          ],\n          \"disableFsBackup\": false\n        }\n      },\n      \"snapshotLocations\": [\n        {\n          \"velero\": {\n            \"config\": {\n              \"profile\": \"default\",\n              \"region\": \"us-west-2\"\n            },\n            \"provider\": \"aws\"\n          }\n        }\n      ]\n    }\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"DataProtectionTest\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"oadp-operator\"\n      },\n      \"name\": \"dataprotectiontest-sample\"\n    },\n    \"spec\": null\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"NonAdminBackup\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"oadp-operator\",\n        \"app.kubernetes.io/instance\": \"nonadminbackup-sample\",\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"nonadminbackup\",\n        \"app.kubernetes.io/part-of\": \"oadp-operator\"\n      },\n      \"name\": \"nonadminbackup-sample\"\n    },\n    \"spec\": {\n      \"backupSpec\": {}\n    }\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"NonAdminBackupStorageLocation\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"oadp-nac\",\n        \"app.kubernetes.io/instance\": \"nonadminbackupstoragelocation-sample\",\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"nonadminbackupstoragelocation\",\n        \"app.kubernetes.io/part-of\": \"oadp-nac\"\n      },\n      \"name\": \"nonadminbackupstoragelocation-sample\"\n    },\n    \"spec\": {\n      \"backupStorageLocationSpec\": {\n        \"config\": {\n          \"checksumAlgorithm\": \"\",\n          \"region\": \"eu-central-1\"\n        },\n        \"credential\": {\n          \"key\": \"default\",\n          \"name\": \"cloud-credentials\"\n        },\n        \"objectStorage\": {\n          \"bucket\": \"my-bucket\",\n          \"prefix\": \"nac-test\"\n        },\n        \"provider\": \"aws\"\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"NonAdminBackupStorageLocationRequest\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"oadp-nac\",\n        \"app.kubernetes.io/instance\": \"nonadminbackupstoragelocationrequest-sample\",\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"nonadminbackupstoragelocationrequest\",\n        \"app.kubernetes.io/part-of\": \"oadp-nac\"\n      },\n      \"name\": \"nonadminbackupstoragelocationrequest-sample\"\n    },\n    \"spec\": {\n      \"approvalDecision\": \"pending\"\n    }\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"NonAdminDownloadRequest\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"oadp-nac\"\n      },\n      \"name\": \"nonadmindownloadrequest-sample\"\n    },\n    \"spec\": {\n      \"target\": {\n        \"kind\": \"BackupLog\",\n        \"name\": \"non-admin-backup-name\"\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"NonAdminRestore\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"oadp-nac\",\n        \"app.kubernetes.io/instance\": \"nonadminrestore-sample\",\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"nonadminrestore\",\n        \"app.kubernetes.io/part-of\": \"oadp-nac\"\n      },\n      \"name\": \"nonadminrestore-sample\"\n    },\n    \"spec\": {\n      \"restoreSpec\": {\n        \"backupName\": \"nonadminbackup-sample\"\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"VirtualMachineBackupsDiscovery\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"oadp-vm-file-restore\"\n      },\n      \"name\": \"virtualmachinebackupsdiscovery-sample\"\n    },\n    \"spec\": {\n      \"endTime\": \"2024-12-31T23:59:59Z\",\n      \"startTime\": \"2024-01-01\",\n      \"virtualMachineName\": \"test-vm\",\n      \"virtualMachineNamespace\": \"test-namespace\"\n    }\n  },\n  {\n    \"apiVersion\": \"oadp.openshift.io/v1alpha1\",\n    \"kind\": \"VirtualMachineFileRestore\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/managed-by\": \"kustomize\",\n        \"app.kubernetes.io/name\": \"oadp-vm-file-restore\"\n      },\n      \"name\": \"virtualmachinefilerestore-sample\"\n    },\n    \"spec\": null\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"Backup\",\n    \"metadata\": {\n      \"name\": \"backup\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"BackupStorageLocation\",\n    \"metadata\": {\n      \"name\": \"backupstoragelocation\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"DeleteBackupRequest\",\n    \"metadata\": {\n      \"name\": \"deletebackuprequest\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"DownloadRequest\",\n    \"metadata\": {\n      \"name\": \"downloadrequest\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"PodVolumeBackup\",\n    \"metadata\": {\n      \"name\": \"podvolumebackup\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"PodVolumeRestore\",\n    \"metadata\": {\n      \"name\": \"podvolumerestore\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"Restore\",\n    \"metadata\": {\n      \"name\": \"restore\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"Schedule\",\n    \"metadata\": {\n      \"name\": \"schedule\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"ServerStatusRequest\",\n    \"metadata\": {\n      \"name\": \"serverstatusrequest\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  },\n  {\n    \"apiVersion\": \"velero.io/v1\",\n    \"kind\": \"VolumeSnapshotLocation\",\n    \"metadata\": {\n      \"name\": \"volumesnapshotlocation\",\n      \"namespace\": \"openshift-adp\"\n    },\n    \"spec\": {}\n  }\n]"
      capabilities: Seamless Upgrades
      categories: 'Cloud Provider,Developer Tools,Modernization & Migration,OpenShift Optional,Storage

        '
      certified: 'false'
      containerImage: registry.redhat.io/oadp/oadp-rhel9-operator@sha256:d812824818938d9a25f213efb4aec2163bf64ed9f26ca11aedd7c2af5dc2d4c0
      createdAt: '2025-02-28T20:03:54Z'
      description: OADP (OpenShift API for Data Protection) operator sets up and installs Data Protection Applications on the OpenShift platform.
      features.operators.openshift.io/cnf: 'false'
      features.operators.openshift.io/cni: 'false'
      features.operators.openshift.io/csi: 'false'
      features.operators.openshift.io/disconnected: 'true'
      features.operators.openshift.io/fips-compliant: 'true'
      features.operators.openshift.io/proxy-aware: 'true'
      features.operators.openshift.io/tls-profiles: 'false'
      features.operators.openshift.io/token-auth-aws: 'true'
      features.operators.openshift.io/token-auth-azure: 'true'
      features.operators.openshift.io/token-auth-gcp: 'true'
      olm.skipRange: '>=1.5.0 <1.6.0'
      operatorframework.io/suggested-namespace: openshift-adp
      operators.openshift.io/infrastructure-features: '["Disconnected"]'
      operators.openshift.io/valid-subscription: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
      operators.operatorframework.io/builder: operator-sdk-v1.35.0
