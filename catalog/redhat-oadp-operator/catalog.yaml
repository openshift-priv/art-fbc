      containerImage: registry.redhat.io/oadp/oadp-rhel9-operator@sha256:9fdcba1ecd82ff34890278b6e4c3f033994f4f45a697f8e335a203b9a179eb58
      createdAt: '2025-02-28T20:03:54Z'
      description: OADP (OpenShift API for Data Protection) operator sets up and installs Data Protection Applications on the OpenShift platform.
      features.operators.openshift.io/cnf: 'false'
      features.operators.openshift.io/cni: 'false'
      features.operators.openshift.io/csi: 'false'
      features.operators.openshift.io/disconnected: 'true'
