- type: olm.csv.metadata
  value:
    annotations:
      capabilities: Full Lifecycle
      categories: Security
      containerImage: registry.redhat.io/quay/quay-container-security-operator-rhel8@sha256:6e3fabc20193ee6cae29211b1e13600b8e8cd3c8146223e83d27f2b5dc97edce
      createdAt: '2020-04-13 00:00:00'
      description: Identify image vulnerabilities in Kubernetes pods
      features.operators.openshift.io/disconnected: 'false'
      features.operators.openshift.io/fips-compliant: 'true'
      features.operators.openshift.io/proxy-aware: 'false'
      features.operators.openshift.io/tls-profiles: 'false'
      features.operators.openshift.io/token-auth-aws: 'false'
      features.operators.openshift.io/token-auth-azure: 'false'
      features.operators.openshift.io/token-auth-gcp: 'false'
      olm.skipRange: '>=3.6.x <3.9.20'
      operators.openshift.io/valid-subscription: '["OpenShift Platform Plus", "Red Hat Quay"]'
