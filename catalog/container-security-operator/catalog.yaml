- type: olm.csv.metadata
  value:
    annotations:
      capabilities: Full Lifecycle
      categories: Security
      containerImage: registry.redhat.io/quay/quay-container-security-operator-rhel8@sha256:d476fe8fe0a265fd4d1d649e8c515ea47c9d55ce3e508d10604afdea1086bef8
