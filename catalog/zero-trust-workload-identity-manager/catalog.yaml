    annotations:
      alm-examples: "[\n  {\n    \"apiVersion\": \"operator.openshift.io/v1alpha1\",\n    \"kind\": \"SpiffeCSIDriver\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"cluster\"\n    },\n    \"spec\": {\n      \"agentSocketPath\": \"/run/spire/agent-sockets\",\n      \"pluginName\": \"csi.spiffe.io\"\n    }\n  },\n  {\n    \"apiVersion\": \"operator.openshift.io/v1alpha1\",\n    \"kind\": \"SpireAgent\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"cluster\"\n    },\n    \"spec\": {\n      \"logFormat\": \"text\",\n      \"logLevel\": \"info\",\n      \"nodeAttestor\": {\n        \"k8sPSATEnabled\": \"true\"\n      },\n      \"workloadAttestors\": {\n        \"k8sEnabled\": \"true\",\n        \"workloadAttestorsVerification\": {\n          \"type\": \"auto\"\n        }\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"operator.openshift.io/v1alpha1\",\n    \"kind\": \"SpireOIDCDiscoveryProvider\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"cluster\"\n    },\n    \"spec\": {\n      \"csiDriverName\": \"csi.spiffe.io\",\n      \"jwtIssuer\": \"https://oidc-discovery.example.com\",\n      \"logFormat\": \"text\",\n      \"logLevel\": \"info\",\n      \"managedRoute\": \"true\",\n      \"replicaCount\": 1\n    }\n  },\n  {\n    \"apiVersion\": \"operator.openshift.io/v1alpha1\",\n    \"kind\": \"SpireServer\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"cluster\"\n    },\n    \"spec\": {\n      \"caKeyType\": \"rsa-2048\",\n      \"caSubject\": {\n        \"commonName\": \"SPIRE Server CA\",\n        \"country\": \"US\",\n        \"organization\": \"Example Corp\"\n      },\n      \"caValidity\": \"24h\",\n      \"datastore\": {\n        \"connectionString\": \"/run/spire/data/datastore.sqlite3\",\n        \"databaseType\": \"sqlite3\",\n        \"maxIdleConns\": 2,\n        \"maxOpenConns\": 100\n      },\n      \"defaultJWTValidity\": \"5m\",\n      \"defaultX509Validity\": \"1h\",\n      \"federation\": {\n        \"bundleEndpoint\": {\n          \"profile\": \"https_spiffe\",\n          \"refreshHint\": 300\n        },\n        \"federatesWith\": [\n          {\n            \"bundleEndpointProfile\": \"https_spiffe\",\n            \"bundleEndpointUrl\": \"https://federation.partner.example.com:8443\",\n            \"endpointSpiffeId\": \"spiffe://partner.example.com/federation/endpoint\",\n            \"trustDomain\": \"partner.example.com\"\n          }\n        ],\n        \"managedRoute\": \"true\"\n      },\n      \"jwtIssuer\": \"https://oidc-discovery.example.com\",\n      \"logFormat\": \"text\",\n      \"logLevel\": \"info\",\n      \"persistence\": {\n        \"accessMode\": \"ReadWriteOnce\",\n        \"size\": \"2Gi\",\n        \"storageClass\": \"\"\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"operator.openshift.io/v1alpha1\",\n    \"kind\": \"ZeroTrustWorkloadIdentityManager\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"cluster\"\n    },\n    \"spec\": {\n      \"bundleConfigMap\": \"spire-bundle\",\n      \"clusterName\": \"prod-cluster\",\n      \"trustDomain\": \"example.com\"\n    }\n  },\n  {\n    \"apiVersion\": \"spire.spiffe.io/v1alpha1\",\n    \"kind\": \"ClusterFederatedTrustDomain\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"example.com\"\n    },\n    \"spec\": {\n      \"bundleEndpointProfile\": \"https_web\",\n      \"trustDomain\": \"example.com\"\n    }\n  },\n  {\n    \"apiVersion\": \"spire.spiffe.io/v1alpha1\",\n    \"kind\": \"ClusterSPIFFEID\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"example-workload\",\n      \"namespace\": \"default\"\n    },\n    \"spec\": {\n      \"dnsNameTemplates\": [\n        \"*.example.com\"\n      ],\n      \"ttl\": 3600,\n      \"workloadSelector\": {\n        \"k8sServiceAccount\": {\n          \"name\": \"example-sa\",\n          \"namespace\": \"example-ns\"\n        }\n      }\n    }\n  },\n  {\n    \"apiVersion\": \"spire.spiffe.io/v1alpha1\",\n    \"kind\": \"ClusterStaticEntry\",\n    \"metadata\": {\n      \"labels\": {\n        \"app.kubernetes.io/created-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/managed-by\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/name\": \"zero-trust-workload-identity-manager\",\n        \"app.kubernetes.io/part-of\": \"zero-trust-workload-identity-manager\"\n      },\n      \"name\": \"example-static-entry\",\n      \"namespace\": \"default\"\n    },\n    \"spec\": {\n      \"parentID\": \"spiffe://example.com/spire/server\",\n      \"selectors\": [\n        {\n          \"type\": \"unix\",\n          \"value\": \"uid:1000\"\n        }\n      ],\n      \"spiffeID\": \"spiffe://example.com/example-workload\",\n      \"ttl\": 3600\n    }\n  }\n]"
