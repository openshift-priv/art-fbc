    crdDescriptions:
      owned:
      - description: AlertingRule is the Schema for the alertingrules API
        displayName: AlertingRule
        kind: AlertingRule
        name: alertingrules.loki.grafana.com
        resources:
        - kind: LokiStack
          name: ''
          version: v1
        specDescriptors:
        - description: List of groups for alerting rules.
          displayName: Groups
          path: groups
        - description: 'Interval defines the time interval between evaluation of the given

            alerting rule.'
          displayName: Evaluation Interval
          path: groups[0].interval
        - description: Limit defines the number of alerts an alerting rule can produce. 0 is no limit.
          displayName: Limit of firing alerts
          path: groups[0].limit
          x-descriptors:
          - urn:alm:descriptor:com.tectonic.ui:number
        - description: Name of the alerting rule group. Must be unique within all alerting rules.
          displayName: Name
          path: groups[0].name
        - description: Rules defines a list of alerting rules
          displayName: Rules
          path: groups[0].rules
        - description: The name of the alert. Must be a valid label value.
          displayName: Name
          path: groups[0].rules[0].alert
        - description: Annotations to add to each alert.
          displayName: Annotations
          path: groups[0].rules[0].annotations
        - description: 'The LogQL expression to evaluate. Every evaluation cycle this is

            evaluated at the current time, and all resultant time series become

            pending/firing alerts.'
          displayName: LogQL Expression
          path: groups[0].rules[0].expr
        - description: 'Alerts are considered firing once they have been returned for this long.

            Alerts which have not yet fired for long enough are considered pending.'
          displayName: Firing Threshold
          path: groups[0].rules[0].for
        - description: Labels to add to each alert.
          displayName: Labels
          path: groups[0].rules[0].labels
        - description: TenantID of tenant where the alerting rules are evaluated in.
          displayName: Tenant ID
          path: tenantID
        statusDescriptors:
        - description: Conditions of the AlertingRule generation health.
          displayName: Conditions
          path: conditions
          x-descriptors:
          - urn:alm:descriptor:io.kubernetes.conditions
        version: v1
