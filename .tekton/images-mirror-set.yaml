---
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: art-images-mirror-set
  namespace: openshift-marketplace
spec:
  imageDigestMirrors:
  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
    source: registry.redhat.io/observatorium/api
  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
    source: registry.redhat.io/observatorium/opa-openshift
  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
    source: registry.redhat.io/openshift-logging/loki
  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
    source: registry.redhat.io/openshift-logging/loki-operator
  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
    source: registry.redhat.io/openshift-logging/loki-operator-bundle
