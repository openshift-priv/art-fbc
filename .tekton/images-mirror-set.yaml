  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
    source: registry.redhat.io/openshift5/metallb-rhel9
  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
    source: registry.redhat.io/openshift5/metallb-rhel9-operator
  - mirrors:
    - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
