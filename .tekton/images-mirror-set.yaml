---
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: art-stage-mirror-set
  namespace: openshift-marketplace
spec:
  imageDigestMirrors:
  - mirrors:
    - registry.redhat.io/openshift4/helloworld-operator-bundle
    - registry.redhat.io/openshift4/helloworld-operator-rhel9
    - registry.redhat.io/openshift4/ose-kube-rbac-proxy-rhel9
    - registry.redhat.io/openshift4/pf-status-relay-operator-bundle
    - registry.redhat.io/openshift4/pf-status-relay-rhel9
    - registry.redhat.io/openshift4/pf-status-relay-rhel9-operator
    source: quay.io/redhat-user-workloads/ocp-art-tenant/art-images
